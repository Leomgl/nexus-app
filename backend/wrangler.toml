name = "nexus-app-api"
main = "src/index.js"
compatibility_date = "2026-11-10"

# GitHub Pages remains the public local-first PWA. This Worker only exposes safe health/config.
[[d1_databases]]
binding = "DB"
database_name = "nexus-app-db"
database_id = "b790938c-402e-4183-91e8-6e400ed28075"
migrations_dir = "migrations"

# Runs every five minutes. Delivery is best-effort, not guaranteed to the exact minute.
[triggers]
crons = ["*/5 * * * *"]

# The public VAPID key is not sensitive. The PRIVATE key stays in Cloudflare Secrets.
[vars]
VAPID_PUBLIC_KEY = "BLVUrNJfkVkwaEXQvQQTDBU1MZXHhcNhp4AoQHkVVBoVT46eMp_0KlFtzlOUZ8abkRv-erV4NpBHmzkU0L-ZcjU"

# E2EE inter-app calls over Cloudflare internal service binding
[[services]]
binding = "LINK_RELAY"
service = "nexus-link-api"
