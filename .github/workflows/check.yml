name: NEXUS JavaScript checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in *.js backend/src/*.js bridge/*.js; do node --check "$file"; done
      - name: Run local smoke tests
        run: node --test tests/*.test.cjs
