<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NEXUS">
  <meta name="description" content="Notes, agenda, tâches, budget, projets et achats dans un second cerveau connecté.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://nexus-app-api.q9pfwtztsc.workers.dev; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="stylesheet" href="./styles.css">
  <title>NEXUS — Ton second cerveau</title>
</head>
<body>
  <div class="app-shell" id="app">
    <aside class="side-nav" aria-label="Navigation principale">
      <a class="brand" href="#home" data-view="home" aria-label="NEXUS, accueil"><span class="brand-symbol">N<span class="brand-dot"></span></span><span>NEXUS<small>SECOND BRAIN</small></span></a>
      <div class="side-label">TON ESPACE</div>
      <nav class="desktop-navigation" id="desktop-nav">
        <button type="button" data-view="home" class="active"><span class="nav-icon" data-icon="home"></span>Accueil</button>
        <button type="button" data-view="notes"><span class="nav-icon" data-icon="notes"></span>Notes</button>
        <button type="button" data-view="calendar"><span class="nav-icon" data-icon="calendar"></span>Calendrier</button>
        <button type="button" data-view="tasks"><span class="nav-icon" data-icon="check"></span>Rappels</button>
        <button type="button" data-view="projects"><span class="nav-icon" data-icon="briefcase"></span>Projets</button>
        <button type="button" data-view="purchases"><span class="nav-icon" data-icon="cart"></span>Achats</button>
        <button type="button" data-view="budget"><span class="nav-icon" data-icon="wallet"></span>Budget</button>
        <button type="button" data-view="contacts"><span class="nav-icon" data-icon="users"></span>Personnes</button>
      </nav>
      <div class="side-bottom"><span class="status-light"></span> Coffre cloud optionnel <small>Version 0.3</small></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-symbol">N<span class="brand-dot"></span></span><strong>NEXUS</strong></div>
        <div class="topbar-meta"><span id="today-small"></span></div>
        <div class="topbar-actions"><button type="button" class="icon-btn" data-action="search" aria-label="Rechercher" title="Rechercher"><span data-icon="search"></span></button><button type="button" class="avatar-btn" data-action="settings" aria-label="Réglages et sauvegarde" title="Réglages et sauvegarde">N</button></div>
      </header>
      <div class="view-content" id="view-root" aria-live="polite"><div class="loading-screen">Chargement de ton espace…</div></div>
    </main>

    <nav class="bottom-nav" aria-label="Navigation mobile">
      <button type="button" data-view="home" class="active"><span data-icon="home"></span><span>Accueil</span></button>
      <button type="button" data-view="notes"><span data-icon="notes"></span><span>Notes</span></button>
      <button type="button" data-view="calendar"><span data-icon="calendar"></span><span>Agenda</span></button>
      <button type="button" data-view="tasks"><span data-icon="check"></span><span>Rappels</span></button>
      <button type="button" data-view="hub"><span data-icon="more"></span><span>Plus</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="restore-file" type="file" accept="application/json,.json" hidden>
  <script src="./app.js" defer></script>
  <script src="./cloud.js" defer></script>
  <script src="./push-client.js" defer></script>
</body>
</html>
