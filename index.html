<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NEXUS">
  <meta name="description" content="Ton second cerveau : capture rapide, organisation, projets, agenda, budget et liens entre blocs.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://nexus-app-api.q9pfwtztsc.workers.dev; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <script src="./lock-boot.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <title>NEXUS — Ton second cerveau</title>
</head>
<body>
  <div class="app-shell" id="app">
    <aside class="side-nav" aria-label="Navigation principale">
      <a class="brand" href="#home" data-nav="home" aria-label="NEXUS, accueil">
       <span class="brand-symbol">N<span class="brand-dot"></span></span><span>NEXUS<small>SECOND BRAIN</small></span>
      </a>
      <div class="side-label">TON ESPACE</div>
      <nav class="desktop-navigation" id="desktop-nav">
        <button type="button" data-nav="home" class="active"><span data-icon="home"></span>Accueil</button>
        <button type="button" data-nav="categories"><span data-icon="grid"></span>Catégories</button>
        <button type="button" data-nav="slot1"><span data-slot-icon="1"></span><span data-slot-label="1">Projets</span></button>
        <button type="button" data-nav="slot2"><span data-slot-icon="2"></span><span data-slot-label="2">Budget</span></button>
        <button type="button" data-nav="settings"><span data-icon="sliders"></span>Réglages</button>
      </nav>
      <div class="side-bottom"><span class="status-light"></span> NEXUS personnel <small>Version 0.8 · PWA</small></div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-symbol">N<span class="brand-dot"></span></span><strong>NEXUS</strong></div>
        <div class="topbar-meta"><span id="today-small"></span></div>
        <div class="topbar-actions"><button type="button" class="icon-btn" data-action="search" aria-label="Rechercher" title="Rechercher"><span data-icon="search"></span></button><button type="button" class="avatar-btn" data-action="settings" aria-label="Ouvrir les réglages" title="Réglages"><span data-icon="sliders"></span></button></div>
      </header>
      <div class="view-content" id="view-root" aria-live="polite"><div class="loading-screen">Chargement de ton espace…</div></div>
    </main>

    <nav class="bottom-nav" aria-label="Navigation mobile">
      <button type="button" data-nav="home" class="active"><span data-icon="home"></span><span>Accueil</span></button>
      <button type="button" data-nav="categories"><span data-icon="grid"></span><span>Catégories</span></button>
      <button type="button" data-nav="slot1"><span data-slot-icon="1"></span><span data-slot-label="1">Projets</span></button>
      <button type="button" data-nav="slot2"><span data-slot-icon="2"></span><span data-slot-label="2">Budget</span></button>
      <button type="button" data-nav="settings"><span data-icon="sliders"></span><span>Réglages</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="restore-file" type="file" accept="application/json,.json" hidden>
  <script src="./app.js" defer></script>
  <script src="./budget-v08.js" defer></script>
  <script src="./cloud.js" defer></script>
  <script src="./push-client.js" defer></script>
  <script src="./passkey-client.js" defer></script>
</body>
</html>
